name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # the app runs `heimdall` with macOS's own Python 3.9
      - name: tests (system Python)
        run: /usr/bin/python3 -m unittest discover tests -v
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: tests (Python 3.12)
        run: python -m unittest discover tests -v
      - name: build app
        run: swiftc -O -swift-version 5 app/*.swift -o "$RUNNER_TEMP/Heimdall"
